name: Free Fire official APK analysis

on:
  push:
    branches: [shizuku-integrado]
    paths:
      - '.github/workflows/freefire-analysis.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-official-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download official Garena page and locate APK
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          import urllib.parse
          import urllib.request

          page_url = "https://ffodownload.freefiremobile.com/?lang=en"
          req = urllib.request.Request(page_url, headers={"User-Agent": "Mozilla/5.0"})
          with urllib.request.urlopen(req, timeout=30) as response:
              html = response.read().decode("utf-8", "replace")
              print("Official page:", response.geturl())
              print("HTTP:", response.status)
          patterns = [
              r'''(?:href|src)\s*=\s*["']([^"']+)["']''',
              r'''https?://[^"'\s<>]+'''
          ]
          candidates = set()
          for pattern in patterns:
              for value in re.findall(pattern, html, re.I):
                  url = urllib.parse.urljoin(page_url, value.replace("&amp;", "&"))
                  host = urllib.parse.urlparse(url).hostname or ""
                  if host == "freefiremobile.com" or host.endswith(".freefiremobile.com"):
                      if ".apk" in url.lower() or "download" in url.lower() or "apk" in url.lower():
                          candidates.add(url)
          print("Official-domain download candidates:")
          for url in sorted(candidates):
              print(url)
          with open("candidates.txt", "w") as f:
              f.write("\n".join(sorted(candidates)))
          if not candidates:
              raise SystemExit("No APK URL exposed in the official page HTML; stopping without using third-party APK mirrors.")
          PY
      - name: Download APK from official Garena domain
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r url; do
            [ -n "$url" ] || continue
            host="$(python3 -c 'import sys,urllib.parse; print(urllib.parse.urlparse(sys.argv[1]).hostname or "")' "$url")"
            case "$host" in freefiremobile.com|*.freefiremobile.com) ;; *) continue ;; esac
            if curl --fail --location --silent --show-error "$url" -o freefire.apk; then
              if file freefire.apk | grep -qi 'Zip archive'; then
                echo "Downloaded APK-like archive from official host: $host"
                exit 0
              fi
            fi
          done < candidates.txt
          echo "No valid APK archive could be downloaded from the official page."
          exit 1
      - name: Inspect package metadata and frame-rate references
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y aapt apktool unzip
          mkdir -p report decoded
          aapt dump badging freefire.apk | tee report/package.txt
          grep -E "^(package:|sdkVersion:|targetSdkVersion:|native-code:)" report/package.txt || true
          apktool d -f -s freefire.apk -o decoded >/dev/null
          (grep -RniE '(^|[^0-9])(60|90|120)[[:space:]_-]*(fps|hz)|fps[^[:alnum:]]*(60|90|120)|frame.?rate|refresh.?rate' decoded 2>/dev/null || true) > report/frame-rate-hits.txt
          unzip -l freefire.apk > report/archive-list.txt
          echo "APK SHA256:"
          sha256sum freefire.apk | tee report/sha256.txt
          echo "Report summary:"
          wc -l report/frame-rate-hits.txt report/archive-list.txt
      - name: Upload analysis report only
        uses: actions/upload-artifact@v4
        with:
          name: freefire-official-apk-analysis
          path: report/
          if-no-files-found: error
